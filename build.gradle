plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    // Sable i Sable Companion (maven autora Sable)
    maven { name = 'RyanHCode';           url = 'https://maven.ryanhcode.dev/releases' }
    maven { name = 'RyanHCode Snapshots'; url = 'https://maven.ryanhcode.dev/snapshots' }
    // Veil
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
    // Create, Ponder (catnip), Flywheel
    maven { name = 'Create'; url = 'https://maven.createmod.net' }
    // Registrate (wymagany przez klasy Create przy kompilacji)
    maven { name = 'DevOS'; url = 'https://mvn.devos.one/snapshots' }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // --- Kompilacja: API Sable (tylko do kompilacji, w grze dostarcza je sam mod Sable) ---
    compileOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") { transitive = false }
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}") { transitive = false }
    compileOnly("foundry.veil:veil-neoforge-${minecraft_version}:${veil_version}") { transitive = false }

    // --- Kompilacja: Create (ster jest blokiem kinetycznym) ---
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}") { transitive = false }
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}") { transitive = false }
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}") { transitive = false }
    compileOnly("com.tterrag.registrate:Registrate:${registrate_version}") { transitive = false }

    // Alternatywa, gdyby maven nie działał: wrzuć jary Sable (+ companion, veil) do folderu libs/
    compileOnly fileTree(dir: 'libs', include: '*.jar')

    // --- Do uruchamiania w dev (runClient): wrzuć jary modów do folderu run-mods/ ---
    // Create, Create Aeronautics (bundled: simulated + aeronautics), Sable
    localRuntime fileTree(dir: 'run-mods', include: '*.jar')
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
